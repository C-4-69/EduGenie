<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <header>
        <h1>EduGenie</h1>
        <p>Your AI-powered learning assistant</p>
    </header>

    <main>
        <section class="input-section">
            <textarea
                id="userInput"
                placeholder="Ask EduGenie anything..."
            ></textarea>

            <div class="buttons">
                <button onclick="askAI()">Ask</button>
                <button onclick="explainTopic()">Explain</button>
                <button onclick="generateQuiz()">Quiz</button>
                <button onclick="summarizeText()">Summarize</button>
                <button onclick="learningPath()">Learning Path</button>
            </div>
        </section>

        <section class="response-section">
            <h2>EduGenie Response</h2>
            <div id="response">
                Your response will appear here...
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
